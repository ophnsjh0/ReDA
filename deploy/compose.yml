# ReDA 운영 (4단계, 결정 4-3): 서비스 계정 uid로 도는 컨테이너 2개, 공개 포트 없음.
#   docker compose --env-file <서버의 compose.env> -f deploy/compose.yml up -d
# compose.env(서버에만 둔다, git 제외)에 적는 값:
#   REDA_IMAGE  빌드한 이미지 (reda:<git sha>)
#   REDA_ROOT   데이터 폴더 (그 아래 hermes/ = Hermes 홈, data/ = ReDA 상태 DB·토큰·설정)
#   REDA_UID / REDA_GID  서비스 계정 uid·gid
#
# gateway·대시보드는 띄우지 않는다. 메신저로 보내기(hermes send)는 봇 토큰만으로 되고, 초안은 reda poll이
# `hermes -z`로 그때그때 에이전트를 부른다. 텔레그램에서 에이전트로 들어오는 대화 경로가 없다.
# Hermes 이미지의 시작 스크립트(s6 /init)는 쓰지 않는다: Hostinger 이미지는 명령과 상관없이 gateway와
# 대시보드를 띄운다. 처음부터 서비스 계정 uid로 ReDA 스크립트만 실행한다 (root 프로세스 없음).
x-reda: &reda
  image: ${REDA_IMAGE:?REDA_IMAGE}
  restart: unless-stopped
  init: true             # 작은 init이 좀비 프로세스(초안 에이전트)를 거둔다
  user: "${REDA_UID:?REDA_UID}:${REDA_GID:?REDA_GID}"
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  environment:
    HOME: /opt/data
    HERMES_HOME: /opt/data
    TZ: KST-9            # tzdata 없이도 한국 시각 (출근 전 요약 시각, 로그)
    REDA_ENV_FILE: /opt/reda-data/reda.env
    REDA_DATA_DIR: /opt/reda-data
    # 개발용 Mac의 .env를 그대로 옮겨 써도 경로는 컨테이너 기준이 되게 덮어쓴다 (환경 변수가 .env보다 우선)
    REDA_GMAIL_TOKEN_FILE: /opt/reda-data/token.json
    REDA_GMAIL_CREDENTIALS_FILE: /opt/reda-data/credentials.json
    REDA_CALENDAR_TOKEN_FILE: /opt/reda-data/calendar_token.json
    REDA_HERMES_BIN: ""
    REDA_DRAFT_PROFILE: reda
    REDA_SUMMARY_PROFILE: reda
  volumes:
    - ${REDA_ROOT:?REDA_ROOT}/hermes:/opt/data
    - ${REDA_ROOT}/data:/opt/reda-data
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  poll:
    <<: *reda
    container_name: reda-poll
    entrypoint: ["/bin/sh", "/opt/reda/deploy/run-poll.sh"]

  schedule-bot:
    <<: *reda
    container_name: reda-schedule-bot
    entrypoint: ["/bin/sh", "/opt/reda/deploy/run-schedule-bot.sh"]
